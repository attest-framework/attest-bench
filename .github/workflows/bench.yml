name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & smoke-check benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build engine
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/attest-engine ./engine/cmd/attest-engine

      - name: Run tests
        run: go test ./... -count=1

      - name: Test published-engine script
        run: bash scripts/test-published-bench.sh

      - name: Smoke-check benchmarks
        working-directory: engine
        run: |
          go test ./internal/protocol/ \
            -run='^$' \
            -bench=. \
            -benchtime=1x \
            -cpu=1

  benchmark:
    name: Benchmark comparison
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read

    env:
      BENCH_FILTER: 'Benchmark(Serialization/|StdioRoundtrip/|Initialize$|Shutdown$|ConcurrentSessions$|ConcurrentSessions_Scaled/|SustainedLoad$|CodecComparison/|SubprocessRoundtrip/|EngineStartup$)'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pr
          persist-credentials: false

      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check base has benchmarks
        id: base-check
        run: |
          if [[ -f base/go.mod && -d base/engine ]]; then
            echo "has_benchmarks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_benchmarks=false" >> "$GITHUB_OUTPUT"
            echo "Base branch has no benchmarks to compare against"
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: pr/go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@be2c69fb417e

      - name: Build engine (PR)
        working-directory: pr
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/attest-engine ./engine/cmd/attest-engine

      - name: Run benchmarks (PR)
        working-directory: pr/engine
        run: |
          go test ./internal/protocol/ \
            -run='^$' \
            -bench="${BENCH_FILTER}" \
            -benchtime=1s \
            -count=5 \
            -cpu=1 \
            -benchmem \
            | tee ../results/bench-pr.txt

      - name: Build engine (base)
        working-directory: base
        if: steps.base-check.outputs.has_benchmarks == 'true'
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/attest-engine ./engine/cmd/attest-engine

      - name: Run benchmarks (base)
        working-directory: base/engine
        if: steps.base-check.outputs.has_benchmarks == 'true'
        run: |
          mkdir -p ../results
          go test ./internal/protocol/ \
            -run='^$' \
            -bench="${BENCH_FILTER}" \
            -benchtime=1s \
            -count=5 \
            -cpu=1 \
            -benchmem \
            | tee ../results/bench-base.txt

      - name: Compare with benchstat
        id: benchstat
        if: steps.base-check.outputs.has_benchmarks == 'true'
        run: |
          OUTPUT=$(benchstat base/results/bench-base.txt pr/results/bench-pr.txt 2>&1)
          echo "${OUTPUT}"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "result<<${delimiter}"
            echo "${OUTPUT}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Comment PR with comparison
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: steps.base-check.outputs.has_benchmarks == 'true'
        env:
          BENCHSTAT_RESULT: ${{ steps.benchstat.outputs.result }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fence = '`'.repeat(3);
            const body = [
              '## Benchmark Comparison',
              '',
              fence,
              process.env.BENCHSTAT_RESULT,
              fence,
              '',
              `_Baseline: \`${process.env.BASE_SHA}\` — PR: \`${process.env.HEAD_SHA}\`_`,
              '_Config: `-benchtime=1s -count=5` — filtered to core benchmarks_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## Benchmark')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment PR (no baseline)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: steps.base-check.outputs.has_benchmarks != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const body = [
              '## Benchmark Results (no baseline)',
              '',
              'Base branch has no benchmarks to compare against. PR benchmark results uploaded as artifact.',
              '',
              `_PR: \`${process.env.HEAD_SHA}\`_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload PR benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-pr
          path: pr/results/bench-pr.txt

      - name: Upload base benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.base-check.outputs.has_benchmarks == 'true'
        with:
          name: bench-results-base
          path: base/results/bench-base.txt
