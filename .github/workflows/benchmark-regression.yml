# Two modes:
#   source-built (default): builds ./engine and compares against the committed
#     baseline. Runs on repository_dispatch and on workflow_dispatch without a tag.
#   published: workflow_dispatch with `tag` benchmarks the released
#     attest-engine-linux-amd64 for that tag against `base_tag` (default: the
#     previous published v* release, rc tags included). The job fails only when
#     the new tag regresses more than 15% against the base; the delta is always
#     written to the job summary and the artifact first. See
#     scripts/published-bench.sh.
#
# Actions are pinned by major-version tag, as in bench.yml.
name: Benchmark Regression Detection

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published attest release to benchmark, e.g. v1.0.0-rc.5 (empty: source-built mode)'
        required: false
        default: ''
        type: string
      base_tag:
        description: 'Published release to compare against (default: previous v* release)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [engine-changed]

permissions:
  contents: read

jobs:
  regression:
    name: Detect benchmark regressions
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build engine binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/attest-engine ./engine/cmd/attest-engine

      - name: Create results directory
        run: mkdir -p results

      - name: Run full benchmark suite
        working-directory: engine
        run: |
          go test ./internal/protocol/ \
            -run='^$' \
            -bench=. \
            -benchmem \
            -benchtime=5s \
            -count=5 \
            -cpu=1 \
            -timeout=30m \
            | tee ../results/bench-current.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Check baseline exists
        id: baseline-check
        run: |
          if [[ -f results/baselines/ci-linux-amd64.txt ]]; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "No committed baseline found — skipping regression check"
          fi

      - name: Compare against baseline
        id: compare
        if: steps.baseline-check.outputs.has_baseline == 'true'
        run: |
          OUTPUT=$(benchstat results/baselines/ci-linux-amd64.txt results/bench-current.txt 2>&1)
          echo "${OUTPUT}"
          {
            echo 'result<<EOF'
            echo "${OUTPUT}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Check for regressions (>15% threshold)
        if: steps.baseline-check.outputs.has_baseline == 'true'
        run: |
          benchstat results/baselines/ci-linux-amd64.txt results/bench-current.txt \
            | awk '
              /^Benchmark/ { next }
              /^[A-Z]/ {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^\+[0-9]+\.?[0-9]*%$/) {
                    gsub(/[+%]/, "", $i)
                    if ($i + 0 > 15) {
                      printf "REGRESSION: %s regressed by %s%%\n", $1, $i
                      found = 1
                    }
                  }
                }
              }
              END {
                if (found) {
                  print "::error::Benchmark regression detected (>15% threshold)"
                  exit 1
                } else {
                  print "No significant regressions detected"
                }
              }
            '

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-regression-results
          path: results/bench-current.txt

  published:
    name: Benchmark published engine
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
      BASE_TAG: ${{ inputs.base_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@be2c69fb417e

      - name: Benchmark published engines
        run: |
          args=(--tag "$TAG" --platform linux-amd64 --out results/published)
          if [[ -n "$BASE_TAG" ]]; then args+=(--base-tag "$BASE_TAG"); fi
          scripts/published-bench.sh "${args[@]}"

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f results/published/summary.md ]]; then
            cat results/published/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-engine-benchmarks
          path: results/published/
