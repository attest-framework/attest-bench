[project]
name = "corpus-bench"
version = "0.1.0"
description = "Fault-corpus benchmark: measured detection rates of attest contracts vs output assertions on labeled agent runs"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
